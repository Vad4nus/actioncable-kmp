name: CableHarness
options:
  bundleIdPrefix: io.github.vad4nus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CABLE_URL: ws://localhost:3000/cable
    KMP_MATRIX: floor
targets:
  CableHarness:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CableURL: $(CABLE_URL)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connects to the Action Cable reference server on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vad4nus.actioncable.check
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework Shared
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17)}"
          "$SRCROOT/../../gradlew" -p "$SRCROOT/.." -Pmatrix="$KMP_MATRIX" :shared:embedAndSignAppleFrameworkForXcode
